<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Copyright</title>
<style>
  :root {
    --bg: #f4f4f6;
    --box-bg: #ffffff;
    --box-border: #d4d4da;
    --box-hover: #8a8a96;
    --text: #1f1f24;
    --muted: #6b6b76;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a;
      --box-bg: #222226;
      --box-border: #3a3a42;
      --box-hover: #8a8a96;
      --text: #f0f0f3;
      --muted: #a0a0ab;
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .page {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
  }
  .card {
    width: min(480px, 100%);
    min-height: 200px;
    padding: 24px;
    background: var(--box-bg);
    border: 2px solid var(--box-border);
    border-radius: 16px;
  }
  .card h1 { margin: 0 0 12px; font-size: 1.2rem; }
  .card p  { margin: 0; font-size: .9rem; line-height: 1.45; color: var(--muted); }
  .site-footer {
    text-align: center;
    padding: 20px;
    font-size: 13px;
  }
  .site-footer a { color: var(--muted); }
  .site-footer a:hover { color: var(--text); }
</style>
</head>
<body>
  <main class="page">
    <div class="card">
    <h1>Hablando de copright:</h1>
    <p>Permito que estas fotos sean subiadas a las redes sociales, pero recureda, si hay alguien que no quiere aparecer en la foto, la cuenta publicadora será denuciada por medios correspondientes (instagram, tiktok...)</p>  <br>
    </div>
  </main>
  <footer class="site-footer">
    <a href="index.html">Volver</a>
  </footer>
</body>
</html>
